name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.17.3
      - name: Lint Python
        run: ruff check --select E9,F,B .
      - name: Lint shell
        run: shellcheck scripts/sync-bundle.sh plugins/oss-status/skills/oss-status/fetch.sh
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Bundle is in sync
        run: |
          ./scripts/sync-bundle.sh
          test -z "$(git status --porcelain plugins/jod-skills)"
      - name: Validate plugin manifests
        run: npx -y @anthropic-ai/claude-code@2.1.318 plugin validate .
